{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>
<body>
<div class="container auth-box">
    <h2 class="mt-5 mb-4">Sign up</h2>
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3"><input class="form-control" name="username" placeholder="Username" required></div>
        <div class="mb-3"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
        <div class="mb-3"><input class="form-control" type="password" name="password1" placeholder="Password" required></div>
        <div class="mb-3"><input class="form-control" type="password" name="password2" placeholder="Confirm password" required></div>
        <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    <p class="mt-3"><a href="{% url 'login' %}">Login</a></p>
</div>
</body>
</html>
