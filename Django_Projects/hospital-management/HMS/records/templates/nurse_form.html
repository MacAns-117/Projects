{% extends "base.html" %}
{% block title %}<title>{{ title }}</title>{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" enctype="multipart/form-data" class="mt-3" style="max-width: 520px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-link" href="{% url 'nurse_list' %}">Cancel</a>
</form>
{% endblock %}
