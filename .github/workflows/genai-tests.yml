name: GenAI tests

on:
  push:
    paths:
      - "GenAi_Projects/**"
      - ".github/workflows/genai-tests.yml"
  pull_request:
    paths:
      - "GenAi_Projects/**"
      - ".github/workflows/genai-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rag_Document_QA
            dir: GenAi_Projects/Rag_Document_QA
            env: {}
          - name: CSV_Insights_Assistant
            dir: GenAi_Projects/CSV_Insights_Assistant
            env: {}
          - name: AI_Research_Agent
            dir: GenAi_Projects/AI_Research_Agent
            env:
              RESEARCH_DEV: "1"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt
      - name: Install system deps (RAG OCR stack unused by unit tests; poppler optional)
        if: matrix.name == 'Rag_Document_QA'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils || true
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # RAG pins torch via sentence-transformers; CPU wheel is fine on GHA
      - name: Pytest (no API keys)
        env:
          RESEARCH_DEV: ${{ matrix.env.RESEARCH_DEV }}
        run: |
          unset GROQ_API_KEY TAVILY_API_KEY || true
          python -m pytest tests/ -q
